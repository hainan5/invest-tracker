name: Update data and deploy site

on:
  push:
    branches:
      - master
  schedule:
    # 23:15 UTC = 次日 07:15 北京时间（开盘前更新隔夜国际行情）
    - cron: "15 23 * * *"
    # 10:15 UTC = 18:15 北京时间（当天 A 股收盘后更新两融余额与国内事件）
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update market data
        if: github.event_name != 'push'
        run: npm run data:update
      - run: npm run data:check
      - name: Commit changed CSV files
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: update commodity prices"
          git push
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
